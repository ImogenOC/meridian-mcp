[package]
name = "dmm-tools"
version = "0.1.0"
authors = ["Tad Hardesty <tad@platymuus.com>"]
edition = "2024"
rust-version = "1.95"

[dependencies]
inflate = "0.4.5"
ndarray = "0.17.2"
rand = "0.10.1"
dreammaker = { version = "=0.1.0", git = "https://github.com/SpaceManiac/SpacemanDMM", rev = "351ddc0ffb2439876d4565ce5130bb6b027ee605" }
dmi = { version = "=0.1.0", git = "https://github.com/SpaceManiac/SpacemanDMM", rev = "351ddc0ffb2439876d4565ce5130bb6b027ee605" }
lodepng = "3.10.7"
indexmap = "2.6.0"
foldhash = "0.2.0"
either = "1.13.0"

[dependencies.bytemuck]
version = "1.19.0"
features = ["derive", "extern_crate_alloc"]

[dependencies.bumpalo]
version = "3.16.0"
features = ["collections"]

[dependencies.png]
version = "0.18.1"
optional = true

[dependencies.gfx_core]
version = "0.9.2"
optional = true

[dependencies.gif]
version = "0.14.2"
optional = true

[dev-dependencies]
walkdir = "2.5.0"
