[package]
name = "dreammaker"
version = "0.1.0"
authors = ["Tad Hardesty <tad@platymuus.com>"]
edition = "2024"
rust-version = "1.95"

[dependencies]
interval-tree = { version = "=0.8.0", git = "https://github.com/SpaceManiac/SpacemanDMM", rev = "351ddc0ffb2439876d4565ce5130bb6b027ee605" }
builtins-proc-macro = { version = "=0.0.0", git = "https://github.com/SpaceManiac/SpacemanDMM", rev = "351ddc0ffb2439876d4565ce5130bb6b027ee605" }
bitflags = "1.3.2"
termcolor = "1.4.1"
ordered-float = "5.3.0"
serde = { version = "1.0.213", features = ["derive"] }
serde_derive = "1.0.213"
toml = "0.5.11"
phf = { version = "0.14.0", features = ["macros"] }
color_space = "0.5.4"
foldhash = "0.2.0"
indexmap = "2.6.0"
get-size = "0.1.4"
get-size-derive = "0.1.3"
beef = "0.5.2"

[dev-dependencies]
walkdir = "2.5.0"
