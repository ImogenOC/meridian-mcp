[package]
name = "meridian-mcp"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "MCP server for DreamMaker language support"
license = "MIT"

[dependencies]
# SpacemanDMM crates from GitHub
dreammaker = { version = "=0.1.0", git = "https://github.com/SpaceManiac/SpacemanDMM", rev = "7fdd00d8e9b7f7583df4960b5ed38269685ec432" }
dreamchecker = { version = "=1.11.0", git = "https://github.com/SpaceManiac/SpacemanDMM", rev = "7fdd00d8e9b7f7583df4960b5ed38269685ec432" }
dmm-tools = { version = "=0.1.0", git = "https://github.com/SpaceManiac/SpacemanDMM", rev = "7fdd00d8e9b7f7583df4960b5ed38269685ec432", features = ["png"] }

# MCP/JSON-RPC handling
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
rmcp = { version = "=3.1.3", features = ["server", "transport-io", "schemars"] }
schemars = "1"

# Utilities
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Image handling for map screenshots
image = "0.24"
png = "0.17"

# Process handling for compiler
which = "6.0"
regex = "1.0"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading"] }

[profile.release]
opt-level = 3
lto = true
